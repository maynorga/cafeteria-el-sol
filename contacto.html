<main class="contenedor-contacto">
  <form class ="formulario-contacto" id= "miformulario">
<h2>Formulario de contacto</h2>
<p>Completa los datos para enviarnos tu consulta</p>

<div class="campo"> <!--Un div es un contenedor de información-->
        <label for="nombre">Ingresa tu nombre:</label> <!--un label es el que muestra la información de lo que se debe ingresar en el input-->
        <input type="text" id="nombre" name="nombre"
          placeholder="Ingresa tu nombre" required> <!--un input recibe la información-->
      </div>

      <div class="campo">
        <label for="telefono">Ingresa tu número de teléfono:</label>
        <input type="tel" id="telefono" name="telefono"
          placeholder="Ingresa tu número" required>
      </div>

      <div class="campo">
        <label for="correo">Ingresa tu correo electrónico</label>
        <input type="email" id="correo" name="correo"
        placeholder="Ingresa tu correo" required>
      </div>

      <div class="campo">
        <label for="mensaje">Mensaje:</label>
        <textarea id="mensaje" name="mensaje" rows="5"
        placeholder="Ingresa tu mensaje" required></textarea>
      </div>

      <div class="botones">
        <button type="submit">Enviar</button>
        <button type="reset" class="boton-secundario">Limpiar</button>



      </div>
    
    <p id="respuesta" class="mensaje" aria-live="polite"></p> <!--este es el párrafo para mostrar la respuesta-->

    
    
    </form>
</main>
